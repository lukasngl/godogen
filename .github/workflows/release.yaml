name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.tool }} for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # godogen
          - {
              tool: godogen,
              cmd: ".",
              goos: linux,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen,
              cmd: ".",
              goos: linux,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen,
              cmd: ".",
              goos: darwin,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen,
              cmd: ".",
              goos: darwin,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen,
              cmd: ".",
              goos: windows,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          # godogen-language-server
          - {
              tool: godogen-language-server,
              cmd: "./godogen-language-server",
              goos: linux,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-language-server,
              cmd: "./godogen-language-server",
              goos: linux,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-language-server,
              cmd: "./godogen-language-server",
              goos: darwin,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-language-server,
              cmd: "./godogen-language-server",
              goos: darwin,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-language-server,
              cmd: "./godogen-language-server",
              goos: windows,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          # godogen-lint
          - {
              tool: godogen-lint,
              cmd: "./cmd/godogen-lint",
              goos: linux,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-lint,
              cmd: "./cmd/godogen-lint",
              goos: linux,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-lint,
              cmd: "./cmd/godogen-lint",
              goos: darwin,
              goarch: amd64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-lint,
              cmd: "./cmd/godogen-lint",
              goos: darwin,
              goarch: arm64,
              runner: ubuntu-latest,
            }
          - {
              tool: godogen-lint,
              cmd: "./cmd/godogen-lint",
              goos: windows,
              goarch: amd64,
              runner: ubuntu-latest,
            }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Get version
        id: version
        run: echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o "${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" \
            ${{ matrix.cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          ls -lah release-assets/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
